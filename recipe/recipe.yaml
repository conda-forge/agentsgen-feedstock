schema_version: 1

context:
  version: "0.5.1"

package:
  name: agentsgen
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/agentsgen/agentsgen-${{ version }}.tar.gz
  sha256: 601fd134feca9c30958d89b7b051eb15f99f52f2276b5d09f76bb5b663bb4695

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - agentsgen = agentsgen.cli:main
      - agents = agentsgen.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - typer >=0.12,<1.0
    - rich >=13,<14

tests:
  - python:
      imports:
        - agentsgen
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - agentsgen --help
      - agents --help

about:
  summary: Generate and safely update AGENTS.md and RUNBOOK.md for coding agents
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/markoblogo/AGENTS.md_generator
  repository: https://github.com/markoblogo/AGENTS.md_generator
  documentation: https://agentsmd.abvx.xyz/

extra:
  recipe-maintainers:
    - markoblogo
